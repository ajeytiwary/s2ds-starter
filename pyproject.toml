[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "measurenature-s2ds-starter"
version = "0.1.0"
description = "Offline S2DS Earth observation workshop starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4"]
analysis = ["numpy>=2,<3", "matplotlib>=3.8,<4", "rasterio>=1.4,<2"]
validation = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[project.scripts]
s2ds-starter = "s2ds_starter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
