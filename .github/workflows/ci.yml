name: Starter checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[analysis]"
      - run: python -m unittest discover -s tests -v
      - run: python -m s2ds_starter demo --output outputs/demo
      - run: python scripts/run_field_analysis.py
      - run: python scripts/run_fire_example.py
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-python-${{ matrix.python }}
          path: outputs/
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[analysis,validation]"
      - run: python scripts/validate_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: outputs/
